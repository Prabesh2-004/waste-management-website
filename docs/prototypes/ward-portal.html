<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ward Waste Management – Ward 17</title>
<style>
:root{--g:#0f8a5a;--gd:#0a6b47;--ink:#0d3b2e;--mut:#6b7f78;--bg:#eef7f3;--ln:#dfeee7;--tint:#e3f4ec;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font:12px/1.35 "Inter","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{display:grid;grid-template-columns:210px 1fr;gap:12px;height:100vh;padding:10px}
.side{background:#fff;border-radius:var(--r);border:1px solid var(--ln);padding:14px 10px;display:flex;flex-direction:column;gap:12px;min-height:0}
.logo{display:flex;gap:9px;align-items:center;font-weight:700;font-size:14px;line-height:1.1;padding:0 4px}
.logo i{width:34px;height:34px;border-radius:9px;background:var(--g);display:grid;place-items:center;color:#fff;font-style:normal}
.ward{background:var(--tint);border-radius:10px;padding:9px;display:flex;gap:8px;align-items:center;font-weight:600}
.ward small{display:block;font-weight:400;color:var(--mut);font-size:10px}
nav{display:flex;flex-direction:column;gap:3px;flex:1}
nav button{text-align:left;padding:10px;border-radius:9px;display:flex;gap:10px;align-items:center;font-size:12.5px;color:#25483c}
nav button.on{background:var(--tint);color:var(--gd);font-weight:600}
nav button:hover{background:#f3faf7}
.user{border:1px solid var(--ln);border-radius:10px;padding:8px;display:flex;gap:8px;align-items:center;font-weight:600}
.av{width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--gd);display:grid;place-items:center;font-weight:700;font-size:11px}
.user small{display:block;font-weight:400;color:var(--mut);font-size:10px}
main{display:grid;grid-template-columns:1fr 260px;grid-template-rows:auto 1fr;gap:10px 12px;min-height:0;min-width:0}
.head{grid-column:1/3;display:flex;justify-content:space-between;align-items:flex-start}
h1{font-size:21px;line-height:1.15}.sub{color:var(--mut);margin-top:2px}
.hr{display:flex;gap:12px;align-items:center}
.date{padding:6px 10px;border-radius:8px;color:#25483c}
.sky{background:linear-gradient(#cfeadd,#e6f4ee);border-radius:10px;padding:8px 12px;font-weight:600;color:var(--gd);font-size:11px}
.body{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.rail{display:flex;flex-direction:column;gap:10px;min-height:0}
.card{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:12px;min-height:0;display:flex;flex-direction:column}
.card.f{flex:1}.card h3{font-size:13.5px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card h3 a,.lnk{color:var(--g);font-size:11px;font-weight:500;cursor:pointer;text-decoration:none}
.kpis{display:grid;gap:10px}.k5{grid-template-columns:repeat(5,1fr)}.k4{grid-template-columns:repeat(4,1fr)}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:var(--r);padding:11px;display:flex;gap:10px;align-items:center}
.kpi b{font-size:21px;display:block;line-height:1.1}.kpi span{color:var(--mut);font-size:11px}.kpi em{font-style:normal;font-size:10.5px;color:var(--mut)}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--tint);font-size:15px}
.bl{background:#e4effd}.am{background:#fdf0d5}.rd{background:#fde4e4}.pu{background:#eee6fb}
.pill{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap;background:var(--tint);color:var(--gd)}
.pill.b{background:#e0ecfb;color:#2a63b8}.pill.a{background:#fdf0d5;color:#b27408}.pill.r{background:#fde4e4;color:#c43838}.pill.n{background:#eef0ef;color:#6b7f78}
.bar{height:6px;background:var(--tint);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:4px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-weight:500;padding:6px 8px;background:#f2faf6;font-size:11px}
td{padding:7px 8px;border-bottom:1px solid #eef5f1}tr.cl{cursor:pointer}tr.cl:hover td{background:#f8fcfa}
.list{display:flex;flex-direction:column;overflow:hidden;min-height:0}
.row{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid #eef5f1;cursor:pointer}.row:hover{background:#f8fcfa}
.row>div:nth-child(2){flex:1;min-width:0}.row small{display:block;color:var(--mut);font-size:10.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:8px}
.tab{padding:7px 14px;color:var(--mut);border-bottom:2px solid transparent;font-weight:500}.tab.on{color:var(--gd);border-color:var(--g);font-weight:600}
.chip{padding:4px 11px;border-radius:20px;background:#f2f6f4;color:#47645a;margin-right:5px;font-size:11px}.chip.on{background:var(--tint);color:var(--gd);font-weight:600}
.btn{background:var(--g);color:#fff;padding:9px 14px;border-radius:8px;font-weight:600;text-align:center}.btn.s{padding:5px 11px;font-size:11px}.btn.o{background:var(--tint);color:var(--gd)}
.qa{display:flex;flex-direction:column;gap:7px}.qa button{border:1px solid var(--ln);border-radius:10px;padding:9px 10px;text-align:left;display:flex;gap:9px;align-items:center;background:#fff}
.qa button:hover{background:#f8fcfa}.qa b{display:block;font-size:12px}.qa small{color:var(--mut);font-size:10.5px}.qa .ar{margin-left:auto;color:var(--mut)}
.help{background:var(--tint);border-radius:var(--r);padding:11px;font-size:11px;color:#3f6354}.help b{display:block;font-size:12px;color:var(--ink)}
.donut{border-radius:50%;display:grid;place-items:center;flex:none}.donut>div{background:#fff;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:700;font-size:15px;line-height:1.1}
.donut small{display:block;font-weight:400;color:var(--mut);font-size:10px}
.leg{display:flex;flex-direction:column;gap:6px;flex:1}.leg div{display:flex;justify-content:space-between;align-items:center}.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.map{flex:1;min-height:0;border-radius:10px;background:#e9efe9;position:relative;overflow:hidden}.map svg{width:100%;height:100%;display:block}
.two{display:grid;gap:10px;min-height:0;flex:1}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;opacity:0;transition:.2s;pointer-events:none}#toast.show{opacity:1}
.thumb{width:62px;height:46px;border-radius:7px;flex:none;background:linear-gradient(135deg,#9fd3b7,#4b9c78)}
.tag{background:#f0f3f2;border-radius:5px;padding:1px 6px;font-size:10px;color:#47645a;margin-right:4px}
@media(max-width:1100px){#app{grid-template-columns:70px 1fr}.side .logo span,.ward span,nav span,.user div{display:none}main{grid-template-columns:1fr 220px}}

.card{overflow:hidden}.two>*{min-height:0}
svg.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}
.ic{border-radius:10px;color:var(--g)}.ic svg{width:18px;height:18px}.ic.bl{color:#2f6fdb}.ic.am{color:#e0990b}.ic.rd{color:#dc4a4a}.ic.pu{color:#7a4fd0}
nav svg{width:18px;height:18px}nav button.on svg{color:var(--g)}
.ward svg,.logo svg{width:20px;height:20px;color:var(--g)}.logo i svg{color:#fff}
.ch{display:flex;gap:10px;align-items:center;margin-bottom:8px}.ch .lnk{margin-left:auto}.ch b{font-size:13.5px}.ht{display:flex;gap:7px;align-items:center}.ht svg{color:var(--g);width:17px;height:17px}.sb{color:var(--mut);font-size:11px}
.tl{border:1px solid var(--ln);padding:12px 14px;cursor:pointer}.tl:first-child{background:linear-gradient(90deg,#eef9f4,#fff)}.tl .ic{width:46px;height:46px}.tl .ic svg{width:23px;height:23px}.tl b{font-size:22px}.ar{margin-left:auto;color:var(--mut)}.ar svg{width:14px;height:14px}
.pr{display:flex;gap:6px;align-items:center}.pr .bar{width:100px}
.pnl{border:1px solid var(--ln);border-radius:10px;padding:4px 10px;display:flex;flex-direction:column;min-height:0}
.dist{flex:1}.dist .row{flex:1;border-bottom:1px solid #eef5f1}.rail .dist{gap:6px}.rail .dist .row{border:1px solid var(--ln);border-radius:10px;padding:6px 10px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.lg{display:flex;gap:16px;font-size:11px;color:var(--mut)}.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.snap{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr 1.5fr;gap:12px;align-items:center}.sn{display:flex;gap:10px;align-items:center}.sn b{display:block;font-size:17px}.sn span{color:var(--mut);font-size:11px}.sn em{display:block;font-style:normal;font-size:10.5px;color:var(--g)}
.info{background:var(--tint);border-radius:10px;padding:9px 11px;display:flex;gap:9px;font-size:10.5px;color:#3f6354}.info b{display:block;color:var(--ink);font-size:11.5px}
.bell{position:relative;display:grid;place-items:center;width:30px}.bell svg{width:19px;height:19px}.bell:after{content:"";position:absolute;top:1px;right:5px;width:7px;height:7px;border-radius:50%;background:#e5484d}
.sky{position:relative;width:240px;height:62px;overflow:hidden;padding:0 14px 0 0;background:linear-gradient(#e3f3ea,#f4faf7);display:flex;align-items:center;justify-content:flex-end;text-align:left}
.sky .sk{position:absolute;left:0;bottom:0;width:100%;height:100%}.stx{position:relative;line-height:1.25}.stx svg{width:16px;height:16px;vertical-align:-3px}
</style></head><body>
<div id="app">
<aside class="side">
 <div class="logo"><i id="lg"></i><span>Ward Waste<br>Management</span></div>
 <div class="ward"><span id="wi"></span><span>Ward 17<small>Kathmandu Metropolitan City</small></span></div>
 <nav id="nav"></nav>
 <div class="user"><div class="av">RS</div><div>Roza Shrestha<small>Ward Official</small></div></div>
</aside>
<main id="main"></main>
</div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const NAV=[['dash','Dashboard','⌂'],['veh','Vehicles & Routes','🚚'],['col','Collection Management','📅'],['aw','Awareness Programs','📢'],['perf','Ward Updates & Performance','📊'],['rep','Reports & Complaints','📄']];
const HEAD={dash:['Ward Dashboard','Good morning, Roza! 👋','Ward 17 · Tuesday, 24 October 2026'],veh:['Vehicles & Routes','Manage vehicles, track approvals and plan local routes'],col:['Collection Management','Track collection progress, monitor routes and manage exceptions'],aw:['Awareness Programs','Build a cleaner, healthier and more sustainable Ward 17'],perf:['Ward Updates & Performance','Share updates, keep the community informed and track your ward’s progress'],rep:['Reports & Complaints','Review open complaints and download ward reports']};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),1600)};
const act=m=>`onclick="toast('${m}')"`;
const P=(c,t)=>`<span class="pill ${c}">${t}</span>`;
const st={Completed:'',  'In progress':'b',Delayed:'a',Missed:'r','On track':'','In service':'',Maintenance:'a',Available:'b','Not started':'n',Upcoming:'b',Draft:'n',Ongoing:'','Registration open':'',Scheduled:'',Confirmed:'','Pending KMC':'a'};
const S=t=>P(st[t]||'',t);
const qa=(a)=>`<div class="card"><h3>Quick actions</h3><div class="qa">${a.map(x=>`<button ${act(x[0])}><span class="ic">${x[2]||'▤'}</span><span><b>${x[0]}</b><small>${x[1]}</small></span><span class="ar">›</span></button>`).join('')}</div></div>`;
const help=t=>`<div class="help"><b>Need help?</b>${t}<br><a class="lnk" ${act('Opening KMC contact details')}>View contact details →</a></div>`;
const donut=(segs,size,mid,sub)=>{let a=0,g=segs.map(s=>{const f=`${s[1]} ${a}% ${a+s[0]}%`;a+=s[0];return f}).join(',');return`<div class="donut" style="width:${size}px;height:${size}px;background:conic-gradient(${g})"><div style="width:${size-28}px;height:${size-28}px"><span>${mid}<small>${sub}</small></span></div></div>`};
const G='#0f8a5a',B='#3b82e6',A='#f0b429',R='#e5484d';
function mapSvg(){return`<svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice"><rect width="400" height="260" fill="#eaf0ea"/><path d="M0 190C90 150 150 230 260 190S380 170 400 150" stroke="#cfe0ee" stroke-width="16" fill="none"/><g stroke="#fff" stroke-width="5" fill="none"><path d="M0 60H400M0 130H400M90 0V260M230 0V260M330 0V260"/></g><text x="150" y="30" font-size="10" fill="#889">Tengal</text><text x="12" y="150" font-size="10" fill="#889">Thamel</text><text x="250" y="20" font-size="10" fill="#889">Chhetrapati</text><text x="130" y="240" font-size="10" fill="#889">Kalanki</text><g fill="none" stroke-width="3"><path d="M50 60L90 40 140 70 120 110 70 100Z" stroke="${G}"/><path d="M150 100L190 60 240 70 270 100" stroke="${B}"/><path d="M120 110L170 150 230 140 290 110" stroke="${A}"/><path d="M290 110L330 160 280 210 200 200" stroke="${R}"/></g><circle cx="270" cy="100" r="9" fill="${B}"/><circle cx="290" cy="110" r="9" fill="${R}"/><circle cx="90" cy="40" r="9" fill="${G}"/><rect x="150" y="125" width="52" height="18" rx="9" fill="#fff"/><text x="160" y="138" font-size="10" font-weight="700" fill="#0d3b2e">Ward 17</text></svg>`}
// Deterministic demo data shared by Dashboard and Collection Management.
const DEMO_DATE='2026-10-24';
const ROUTE_META=[
 {route_id:'R-A',name:'Route A · North',vehicle:'Truck 01',driver:'Ram K.',start:'07:00',end:'10:00',stops:['Completed','Completed','Completed','Completed']},
 {route_id:'R-B',name:'Route B · East',vehicle:'Truck 04',driver:'Sita M.',start:'08:00',end:'11:00',stops:['Completed','Completed','In progress','In progress']},
 {route_id:'R-C',name:'Route C · Chhetrapati',vehicle:'Truck 02',driver:'Hari B.',start:'07:00',end:'10:00',stops:['Delayed','Delayed','Delayed','Missed']},
 {route_id:'R-D',name:'Route D · Kalanki',vehicle:'Truck 03',driver:'Nabin T.',start:'09:00',end:'12:00',stops:['Completed','Completed','Delayed','Delayed']},
 {route_id:'R-E',name:'Route E · Thamel',vehicle:'Truck 05',driver:'Sunita R.',start:'07:00',end:'10:00',stops:['Completed','Completed','Completed','Completed']}
];
const STOP_DATA=ROUTE_META.flatMap(r=>r.stops.map((status,i)=>({stop_id:`${r.route_id}-S${i+1}`,route_id:r.route_id,ward_id:'W-17',location_id:`${r.route_id}-LOC${i+1}`,location:`${r.name.split('· ')[1]} · Stop ${i+1}`,scheduled_date:DEMO_DATE,scheduled_time:`${String(7+((i+r.route_id.charCodeAt(2))%4)).padStart(2,'0')}:${i%2?'30':'00'}`,stop_order:i+1,waste_type:i%2?'Inorganic':'Organic',collection_status:status,driver_updated_at:status==='Completed'?'2026-10-24T09:20:00':status==='In progress'?'2026-10-24T09:50:00':null,completion_time:status==='Completed'?'2026-10-24T09:20:00':null,exception_reason:status==='Delayed'?'No completion confirmation within 30-minute threshold':status==='Missed'?'Service window ended without completion confirmation':null,last_modified_by:status==='Completed'||status==='In progress'?'Driver':'Demo rule'})));
const GPS_DATA=ROUTE_META.map((r,i)=>({vehicle_id:r.vehicle,latitude:null,longitude:null,gps_recorded_at:null,gps_received_at:null,gps_status:'unavailable'}));
const statusColor=s=>s==='Completed'?G:s==='In progress'?B:s==='Delayed'?A:s==='Missed'?R:'#8b9b94';
const eligibleStops=()=>STOP_DATA.filter(s=>s.collection_status!=='Cancelled');
const countStops=status=>eligibleStops().filter(s=>s.collection_status===status).length;
const routeSummary=()=>ROUTE_META.map(r=>{const ss=eligibleStops().filter(s=>s.route_id===r.route_id);const done=ss.filter(s=>s.collection_status==='Completed').length;const statuses=ss.map(s=>s.collection_status);const status=done===ss.length?'Completed':statuses.includes('Missed')?'Missed':statuses.includes('Delayed')?'Delayed':statuses.includes('In progress')?'In progress':'Scheduled';return { ...r,total:ss.length,done,status,color:statusColor(status)};});
const routeRows=(f)=>routeSummary().filter(r=>!f||f==='All'||r.status===f).map(r=>`<div class="row" onclick="openRouteStops('${r.route_id}')"><span class="ic" style="background:${r.color}22;color:${r.color}">●</span><div><b>${r.name}</b><small>${r.vehicle} · ${r.driver} · ${r.done} / ${r.total} stops</small></div>${S(r.status)}<span>›</span></div>`).join('');
const stopMetrics=()=>({total:eligibleStops().length,completed:countStops('Completed'),progress:countStops('In progress'),delayed:countStops('Delayed'),missed:countStops('Missed'),remaining:eligibleStops().filter(s=>!['Completed','Cancelled'].includes(s.collection_status)).length});


const V={
dash:()=>{
const T=(c,i,l,v,sub,bar)=>`<div class="kpi tl" ${act(l)}><span class="ic ${c}">${i}</span><div><span>${l}</span><b>${v}</b>${bar?'<div class="pr"><div class="bar"><i style="width:67%"></i></div><em>67%</em></div>':''}<em>${sub}</em></div><span class="ar">›</span></div>`;
const rt=routeSummary().map(r=>[r.name,`${r.vehicle} · Driver: ${r.driver}`,`${r.done} / ${r.total} stops · ${r.start}–${r.end}`,r.status,r.status==='In progress'?'b':r.status==='Delayed'?'a':r.status==='Missed'?'r':'',r.color]);
const M=(i,c,v,l,sub)=>`<div class="sn"><span class="ic ${c}">${i}</span><div><b>${v}</b><span>${l}</span><em>${sub}</em></div></div>`;
const AT=[['⚠','rd','Missed collection','Tengal','Follow up with driver'],['⏱','am','Delayed collection','Kalanki · Route D','Check route / contact driver'],['📄','rd','Overdue complaint','Ref #C-0321 · Chhetrapati','Update status'],['🚚','bl','Vehicle request awaiting KMC','Ref #VR-0243 · Ward 17','Submitted 2 days ago'],['📅','pu','Multi-ward schedule change','Affects Ward 17, 18, 19','Pending KMC approval']];
const UP=[['📢','','Community clean-up drive','Ward 17 · Oct 26, 9:00 AM','Scheduled'],['📅','bl','Collection timing change','Tengal · Oct 28, 7:00 AM','Pending KMC'],['📄','pu','Awareness program','Ward 17 · Nov 2, 10:00 AM','Confirmed']];
return[`
<div class="card"><div class="ch"><span class="ht">⏱ <b>Today’s operational summary</b></span><a class="lnk" ${act('All summaries')}>View all →</a></div>
<div class="kpis k4">${T('','🚚','Collections',`${stopMetrics().completed} / ${stopMetrics().total}`,'Stops completed today',1)}${T('am','⚠','Delayed / Missed',`${stopMetrics().delayed + stopMetrics().missed}`,'Need follow-up')}${T('rd','📄','Open complaints','12','2 overdue')}${T('bl','🚚','Vehicles available','4 / 5','Demo vehicle inventory')}</div></div>
<div class="card f"><div class="ch"><span class="ht">📍 <b>Collection activity</b></span><span class="sb">GPS location separate from driver-confirmed status</span>${P('n','Demo data')}<a class="lnk" ${act('All routes')}>View all routes →</a></div>
<div class="two" style="grid-template-columns:1.35fr 1fr"><div style="display:flex;flex-direction:column;gap:6px;min-height:0"><div class="map">${mapSvg()}</div><div class="lg"><span><i style="background:${G}"></i>Completed</span><span><i style="background:${B}"></i>In progress</span><span><i style="background:${A}"></i>Delayed</span><span><i style="background:${R}"></i>Missed</span></div></div>
<div class="pnl"><div class="tabs" style="margin:0"><span class="tab on" onclick="tabs(this)">Routes</span><span class="tab" onclick="tabs(this)">Stops</span></div><div class="list dist">${rt.map(r=>`<div class="row" ${act(r[0])}><span class="dot" style="background:${r[5]}"></span><div><b>${r[0]}</b><small>${r[1]}<br>${r[2]}</small></div>${P(r[4],r[3])}<span class="ar">›</span></div>`).join('')}</div></div></div></div>
<div class="card"><div class="ch"><span class="ht">📊 <b>Ward progress snapshot</b></span><a class="lnk" ${act('Details')}>View details</a></div>
<div class="snap"><div class="sn">${donut([[stopMetrics().completed/Math.max(1,stopMetrics().total)*100,G],[100-stopMetrics().completed/Math.max(1,stopMetrics().total)*100,'#d8eee3']],56,`${Math.round(stopMetrics().completed/Math.max(1,stopMetrics().total)*100)}%`,'')}<div><span>Collection completion rate</span><b style="font-size:13px">${stopMetrics().completed} / ${stopMetrics().total} stops</b></div></div>${M('🗑','','12.6 tons','Waste collected (today)','↑ 8% vs. last week')}${M('👥','','124','Awareness participation','↑ 12% vs. last month')}${M('★','','3 / 5','Milestones achieved','On track')}

function openRouteStops(routeId){const r=ROUTE_META.find(x=>x.route_id===routeId);if(!r)return;const rows=STOP_DATA.filter(x=>x.route_id===routeId).map(x=>`${x.stop_id} · ${x.location} · ${x.collection_status}`).join('\n');const chosen=prompt(`${r.name} — stops\n${rows}\n\nEnter a stop ID to update (e.g. ${routeId}-S1), or Cancel:`);if(!chosen)return;const stop=STOP_DATA.find(x=>x.stop_id.toLowerCase()===chosen.trim().toLowerCase()&&x.route_id===routeId);if(!stop){toast('Stop ID not found');return;}const next=prompt(`Update ${stop.stop_id} status. Enter one of: Scheduled, In progress, Completed, Delayed, Missed, Cancelled`,stop.collection_status);if(!next)return;const allowed=['Scheduled','In progress','Completed','Delayed','Missed','Cancelled'];const value=allowed.find(x=>x.toLowerCase()===next.trim().toLowerCase());if(!value){toast('Invalid status. No changes made.');return;}stop.collection_status=value;stop.driver_updated_at=value==='Completed'||value==='In progress'?'2026-10-24T10:00:00':null;stop.completion_time=value==='Completed'?'2026-10-24T10:00:00':null;stop.exception_reason=value==='Delayed'?'Manually marked delayed (30-minute rule)':value==='Missed'?'Ward-confirmed missed after service window ended':null;stop.last_modified_by='Ward Official';toast(`${stop.stop_id} updated to ${value}`);go(currentPage);}
