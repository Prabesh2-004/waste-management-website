<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KMC Waste Management Portal</title>
<style>
:root{--g:#12894a;--gd:#0b3b2a;--bg:#eef8f2;--t:#5b7167;--l:#dcefe3;--bd:#e3efe7;--red:#e5484d;--am:#e8a317;--bl:#3b82f6;--pu:#7c5cd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(10px,.78vw,15px);height:100%}
body{height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:var(--gd);background:var(--bg);font-size:1rem;line-height:1.35}
#app{display:grid;grid-template-columns:16.5rem 1fr;gap:.8rem;height:100%;padding:.8rem}
aside{background:#fff;border-radius:1rem;padding:1rem .7rem;display:flex;flex-direction:column;gap:.3rem}
.logo{display:flex;gap:.6rem;align-items:center;padding:0 .4rem 1rem;font-weight:700;line-height:1.15}
.logo i{width:2.6rem;height:2.6rem;border-radius:.7rem;background:var(--g);color:#fff;display:grid;place-items:center;font-style:normal;font-size:1.3rem}
.logo small{display:block;font-weight:400;color:var(--t);font-size:.8rem}
nav button{display:flex;gap:.7rem;align-items:center;width:100%;padding:.7rem .8rem;border:0;background:none;border-radius:.7rem;color:var(--gd);font:inherit;cursor:pointer;text-align:left}
nav button.on{background:var(--l);color:var(--g);font-weight:600}
nav button:hover{background:#f1f9f4}
.me{margin-top:auto;display:flex;gap:.6rem;align-items:center;border:1px solid var(--bd);border-radius:.8rem;padding:.6rem}
.av{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--l);color:var(--g);font-weight:700;display:grid;place-items:center;flex:none}
.me small{display:block;color:var(--t);font-size:.8rem}
main{display:flex;flex-direction:column;gap:.7rem;min-width:0;min-height:0}
header{display:flex;justify-content:space-between;align-items:flex-start}
h1{font-size:2rem;line-height:1.1}
header p{color:var(--t);margin-top:.2rem}
.hr{display:flex;gap:1.2rem;align-items:center;color:var(--t)}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:.7rem}
.row{display:flex;gap:.7rem;min-height:0;flex:1}
.col{display:flex;flex-direction:column;gap:.7rem;min-height:0;min-width:0}
.card{background:#fff;border:1px solid var(--bd);border-radius:.9rem;padding:.8rem .9rem;min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card h3{font-size:1.1rem;margin-bottom:.1rem}
.card .sub{color:var(--t);font-size:.85rem;margin-bottom:.5rem}
.kpis{display:grid;gap:.7rem;grid-auto-flow:column;grid-auto-columns:1fr}
.kpi{flex-direction:row;align-items:center;gap:.8rem}
.kpi i{width:2.8rem;height:2.8rem;border-radius:50%;background:var(--l);display:grid;place-items:center;font-style:normal;font-size:1.3rem;flex:none}
.kpi small{color:var(--t);display:block}.kpi b{font-size:1.7rem;line-height:1.1}.kpi em{font-style:normal;font-size:.85rem;color:var(--g);display:block}.kpi em.dn{color:var(--red)}
.b{display:inline-block;padding:.12rem .55rem;border-radius:1rem;font-size:.8rem;white-space:nowrap;background:var(--l);color:var(--g)}
.b.a{background:#fdf1d8;color:#a8740a}.b.r{background:#fde4e4;color:var(--red)}.b.bl{background:#e3eeff;color:var(--bl)}.b.pu{background:#ece7fa;color:var(--pu)}
.tw{flex:1;min-height:0;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--t);font-weight:500;font-size:.85rem;padding:.45rem .4rem;background:#f5faf7}
td{padding:.5rem .4rem;border-bottom:1px solid var(--bd)}
tr.sel td{background:#eef8f2}tbody tr{cursor:pointer}tbody tr:hover td{background:#f6fbf8}
td small{display:block;color:var(--t);font-size:.8rem}
.pb{height:.4rem;background:var(--l);border-radius:1rem;overflow:hidden;min-width:3rem}.pb i{display:block;height:100%;background:var(--g)}
.tabs{display:flex;gap:.4rem;margin-bottom:.6rem}
.tabs button{border:1px solid var(--bd);background:#fff;padding:.35rem .9rem;border-radius:2rem;font:inherit;color:var(--gd);cursor:pointer}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.btn{border:1px solid var(--g);background:var(--g);color:#fff;padding:.55rem .9rem;border-radius:.6rem;font:inherit;cursor:pointer}
.btn.o{background:#fff;color:var(--g)}.btn.r{background:#fde4e4;color:var(--red);border-color:#f8c9c9}
.btns{display:flex;gap:.5rem}.btns .btn{flex:1}
.mp{position:relative;flex:1;min-height:0}.mp canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:pointer}.zb{position:absolute;left:0;top:0;display:flex;flex-direction:column;gap:.3rem}.zb button{width:1.9rem;height:1.9rem;border:1px solid var(--bd);background:#fff;border-radius:.5rem;font-size:1rem;color:var(--gd);cursor:pointer}
.map div{background:#cfeadb;border-radius:.4rem;display:grid;place-items:center;font-weight:600;cursor:pointer;border:2px solid transparent}
.map .a{background:#fbe9b7}.map .r{background:#f8c9c9}.map .sel{background:var(--g);color:#fff}
.lg{display:flex;gap:1rem;color:var(--t);font-size:.85rem;margin-top:.5rem}.lg s{display:inline-block;width:.8rem;height:.8rem;border-radius:.2rem;margin-right:.3rem;vertical-align:-.1rem;text-decoration:none}
.li{display:flex;gap:.7rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--bd);justify-content:space-between}
.li:last-child{border:0}.li>div{min-width:0}.li small{color:var(--t);display:block}
.li i{font-style:normal;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--l);display:grid;place-items:center;flex:none}
.kv{display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid var(--bd)}.kv span{color:var(--t)}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;flex:none}
.cc{padding:0}.cc .im{height:5rem;background:linear-gradient(135deg,#7fc99a,#2b9a5c)}.cc .im.w{background:linear-gradient(135deg,#e8c27a,#d98b3a)}.cc .im.x{background:linear-gradient(135deg,#9cc5e8,#4b8fd0)}
.cc .bd{padding:.6rem .8rem}
input,select,textarea{width:100%;border:1px solid var(--bd);border-radius:.5rem;padding:.45rem .6rem;font:inherit;color:var(--gd);background:#fff;margin:.2rem 0 .5rem}
textarea{resize:none}label{font-size:.85rem}
.donut{width:7rem;height:7rem;border-radius:50%;display:grid;place-items:center;flex:none}.donut div{width:4.6rem;height:4.6rem;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1.1}
svg.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}.kpi i,.li i{color:var(--g)}.kpi i svg{width:1.4rem;height:1.4rem}.li i svg{width:1.1rem;height:1.1rem}nav button span{display:grid}nav button svg{width:1.2rem;height:1.2rem}.logo i svg{width:1.5rem;height:1.5rem}.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--gd);color:#fff;padding:.6rem 1.2rem;border-radius:2rem;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
</style></head><body>
<div id="app"><aside><div class="logo"><i id="lg"></i><div>KMC<small>Kathmandu Metropolitan City</small></div></div><nav id="nav"></nav>
<div class="me"><span class="av">RS</span><div><b>Roza Shrestha</b><small>KMC Officer</small></div></div></aside>
<main><header><div><h1 id="ti"></h1><p id="su"></p></div><div class="hr"><span id="bl"></span><span>Tue, Oct 24, 2026</span></div></header><div class="view" id="v"></div></main></div>
<div class="toast" id="to"></div>
<script>

const S={p:0,ward:17,veh:0,cmp:0,wm:3,cf:"All",uf:"All",tab:0};

const bg=t=>`<span class="b ${SC[t]||""}">${t}</span>`;
const IC={"🏛":'<path d="M3 21h18M5 21V10M9 21V10M15 21V10M19 21V10M2 10l10-6 10 6z"/>',"🔔":'<path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 004 0"/>',"🚚":'<path d="M2 5h11v11H2zM13 9h4l4 4v3h-4"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',"📅":'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',"📢":'<path d="M3 11v3l12 5V6zM15 8a4 4 0 010 8M6 15l1 5h3l-1-4"/>',"📊":'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',"📄":'<path d="M14 3H6a1 1 0 00-1 1v16a1 1 0 001 1h12a1 1 0 001-1V8zM14 3v5h5M9 13h6M9 17h6"/>',"📋":'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h6"/>',"⚠":'<path d="M12 3l10 18H2zM12 10v5M12 18v.5"/>',"✅":'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',"🔧":'<path d="M14 6a4 4 0 005 5l-8 8a2 2 0 01-3-3l8-8a4 4 0 00-2-2z"/>',"🗑":'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/>',"🌿":'<path d="M5 19C5 9 11 4 20 4c0 9-5 15-14 15zM5 19l8-8"/>',"👥":'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M16 5a3 3 0 010 6M18 14c2 1 3 3 3 6"/>',"📍":'<path d="M12 21s7-6 7-12a7 7 0 00-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',"⏱":'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',"🔺":'<path d="M12 4l9 16H3z"/>',"🟡":'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',"🧭":'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',"📴":'<path d="M3 3l18 18M8 4h8a1 1 0 011 1v8M7 7v13a1 1 0 001 1h8a1 1 0 001-1v-2"/>',"ℹ":'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',"♻":'<path d="M7 19l-3-5 3-5M4 14h8M17 5l3 5-3 5M20 10h-8M12 4l2 3-4 1"/>'};
const ico=e=>{const k=String(e).replace(/\uFE0F/g,"");return IC[k]?`<svg class="ic" viewBox="0 0 24 24">${IC[k]}</svg>`:e};
const kpi=(i,l,v,d,dn)=>`<div class="card kpi"><i>${ico(i)}</i><div><small>${l}</small><b>${v}</b><em class="${dn?"dn":""}">${d}</em></div></div>`;
const pb=p=>`<div class="pb"><i style="width:${p}%"></i></div>`;
const tbl=(h,r,sel,on)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.map((c,i)=>`<tr class="${i===sel?"sel":""}" ${on?`onclick="${on}(${i})"`:""}>${c.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const tabs=(a,cur,fn)=>`<div class="tabs">${a.map(x=>`<button class="${x===cur?"on":""}" onclick="${fn}('${x}')">${x}</button>`).join("")}</div>`;
const li=(i,t,s,r)=>`<div class="li"><i>${ico(i)}</i><div style="flex:1"><b>${t}</b><small>${s}</small></div>${r}</div>`;
const toast=m=>{const t=$("#to");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)};
const wst=n=>[14,29,19,31].includes(n)?"a":[8,22].includes(n)?"r":"";
const map=()=>`<div class="mp"><canvas id="mc" onclick="mapClick(event)"></canvas><div class="zb"><button onclick="toast('Zoom in')">+</button><button onclick="toast('Zoom out')">−</button><button onclick="toast('Centered on Kathmandu')">◎</button></div></div><div class="lg"><span><s style="background:#cfeadb"></s>On schedule (26)</span><span><s style="background:#fbe9b7"></s>Partial (4)</span><span><s style="background:#f8c9c9"></s>Attention (2)</span></div>`;

const VEH=[["VR-2026-041","Ward 12","New Road","Compactor Truck","5 MT · Diesel","Oct 22","Under Review"],["VR-2026-040","Ward 17","Tinkune","Collection Truck","3 MT · Diesel","Oct 21","Pending Info"],["VR-2026-039","Ward 5","Balkumari","Van","1.5 MT · Electric","Oct 20","Under Review"],["VR-2026-038","Ward 21","Sankhamul","Collection Truck","5 MT · Diesel","Oct 19","Approved"],["VR-2026-037","Ward 8","Kalimati","Pickup Truck","1 MT · Diesel","Oct 18","Rejected"],["VR-2026-036","Ward 3","Chabahil","Compactor Truck","8 MT · Diesel","Oct 17","Returned"],["VR-2026-035","Ward 27","Gwarko","Van","1.5 MT · Electric","Oct 16","Pending Info"]];
const CMP=[["CMP-1048","Cross-ward (12 & 15)","Illegal dumping","High","Environment Dept.","In Progress","Oct 27"],["CMP-1047","Ward 17","Missed collection","Medium","Waste Management","Pending Info","Oct 26"],["CMP-1046","Ward 8","Overflowing bin","High","Field Operations","Escalated","Oct 25"],["CMP-1045","Ward 4","Recycling facility issue","Medium","Recycling Unit","In Progress","Oct 29"],["CMP-1044","Ward 21","Air pollution (burning)","High","Environment Dept.","New","Nov 2"],["CMP-1043","Cross-ward (3 & 11)","Blocked road","High","Traffic Management","In Progress","Oct 25"],["CMP-1042","Ward 27","E-waste disposal","Medium","Recycling Unit","Resolved","Oct 20"],["CMP-1041","Ward 16","Truck noise","Low","Waste Management","Resolved","Oct 18"]];
const WM=[["Ward 1","Boudha",98,1,42,100,"156 / 200",78,"On track"],["Ward 2","Tinkune",95,2,38,93,"120 / 150",65,"On track"],["Ward 3","Chabahil",88,5,31,80,"98 / 150",52,"Needs attention"],["Ward 4","Gongabu",76,12,28,60,"76 / 120",41,"Critical"],["Ward 5","Kalanki",93,3,35,88,"110 / 150",60,"On track"],["Ward 6","Sukedhara",91,4,33,75,"92 / 120",58,"Needs attention"],["Ward 7","Gwarko",89,6,30,70,"85 / 120",56,"Needs attention"],["Ward 9","Chabahil",82,9,26,65,"70 / 120",45,"Critical"]];
const CAM=[["Clean Kathmandu Green Future","Citywide","Nov 5 – 10","All 32",1240,1500,"Upcoming"],["Tree for a Greener City","Citywide","Nov 18 – 20","All 32",980,1200,"Upcoming"],["Ward 17 Community Clean-up","Ward","Oct 22 – 31","Ward 17",120,150,"Ongoing"],["Plastic Free Kathmandu","Ward","Oct 22 – Nov 5","Ward 12",210,300,"Ongoing"],["E-Waste Collection Drive","Citywide","Nov 1 – 15","All 32",620,1000,"Upcoming"],["Waste Segregation Training","Ward","Oct 28 – Nov 10","Ward 25",85,120,"Draft"]];
const UPD=[["📢","KMC launches citywide waste awareness campaign","Oct 23","Announcement"],["📄","Quarterly Waste Management Report (Q3 2026)","Oct 20","Report"],["⚠️","Temporary road closure – Thamel area","Oct 18","Notice"],["📅","Training for Ward Waste Management Teams","Oct 15","Event"],["📄","Guideline on E-waste Management","Oct 12","Guideline"]];

const V=[
()=>{const w=S.ward;return `<div class="kpis">${kpi("🗑","Waste Collected","1,600 tons","↑ 6% vs. last week")}${kpi("🌿","Collection Coverage","92%","↑ 4% vs. last month")}${kpi("🚚","Active Vehicles","128","112 operational · 16 maintenance")}${kpi("⚠️","Escalated Complaints","18","↑ 20% vs. last week",1)}</div>

<div class="card" style="flex:1"><h3>Needs KMC Attention</h3><div class="sub">12 items pending</div>${[["🚚","Vehicle registration request","Ward 12 · 2 vehicles","Pending"],["📅","Multi-ward schedule change","Wards 8, 9, 10 · Festival","Pending"],["⚠️","Escalated complaint","Ward 22 · 4 days","High"],["🚚","Vehicle approval (replacement)","Ward 29","Pending"]].map(x=>li(x[0],x[1],x[2],bg(x[3]))).join("")}</div></div>
<div class="row" style="flex:1"><div class="card" style="flex:1.2"><h3>Citywide Progress</h3><div class="sub">Progress toward waste management targets</div>${[["Increase segregation at source",58],["Improve recycling & recovery",24],["Reduce landfill dependence",15]].map(x=>`<div class="li"><div style="flex:1">${x[0]}${pb(x[1])}</div><b>${x[1]}%</b></div>`).join("")}</div>
<div class="card" style="flex:1"><h3>Ward Performance</h3><div class="row" style="align-items:center"><div class="donut" style="background:conic-gradient(var(--g) 0 81%,#fbe9b7 81% 94%,#f8c9c9 94%)"><div><b style="font-size:1.4rem">32</b><small>Wards</small></div></div><div style="flex:1"><div class="kv"><span>On schedule</span><b>26 · 81%</b></div><div class="kv"><span>Partial</span><b>4 · 12%</b></div><div class="kv"><span>Intervention</span><b>2 · 6%</b></div></div></div></div>
<div class="card" style="flex:1"><h3>Recent Activity</h3>${[["Ward 12 vehicle request submitted","10:24 AM"],["Issue in Ward 22 escalated","09:40 AM"],["Schedule change (W8, W9, W10)","Yesterday"],["Ward 29 replacement request","Yesterday"]].map(x=>`<div class="kv"><span style="color:var(--gd)">${x[0]}</span><span>${x[1]}</span></div>`).join("")}</div></div>`},

()=>{const v=VEH[S.veh];return `<div class="kpis">${kpi("🚚","Registered Vehicles","48","↑ 6% vs. last month")}${kpi("✅","Operational","42","↑ 5% vs. last month")}${kpi("🔧","Under Maintenance","4","↑ 2% vs. last month")}${kpi("📄","Pending Ward Requests","7","↓ 3% vs. last month",1)}</div>
